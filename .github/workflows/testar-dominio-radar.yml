name: Verificar API do dominio Wodburn
on:
  push:
    paths: [".github/workflows/testar-dominio-radar.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-cors:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar acesso da API via domínio personalizado
        run: |
          set -euo pipefail
          api=https://ylmtitgkkmkwufbnzlgt.supabase.co/functions/v1/wodburn-radar
          for origin in https://diego2216.github.io https://radar.wodburn.com.br; do
            headers=$(mktemp)
            status=$(curl --retry 3 --retry-delay 2 -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS \
              -H "Origin: $origin" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "$api")
            test "$status" = "204"
            grep -Fqi "access-control-allow-origin: $origin" "$headers"
            echo "$origin: API liberada (204)"
          done
      - name: Conferir CNAME no repositório
        run: |
          status=$(curl -L -sS -o /tmp/domain-cname -w "%{http_code}" https://raw.githubusercontent.com/Diego2216/agencywb-formulario/main/CNAME)
          test "$status" = "200"
          grep -Fxq radar.wodburn.com.br /tmp/domain-cname
          echo "CNAME cadastrado no GitHub"

      - name: Diagnosticar DNS e emissao do certificado HTTPS
        run: |
          echo "DNS CNAME pelo Cloudflare:"
          dig +time=3 +tries=1 @1.1.1.1 +short radar.wodburn.com.br CNAME || true
          echo "DNS CNAME pelo Google:"
          dig +time=3 +tries=1 @8.8.8.8 +short radar.wodburn.com.br CNAME || true
          echo "DNS A pelo Cloudflare:"
          dig +time=3 +tries=1 @1.1.1.1 +short radar.wodburn.com.br A || true
          echo "CAA do dominio principal:"
          dig +time=3 +tries=1 @1.1.1.1 +short wodburn.com.br CAA || true
          echo "HTTP no subdominio:"
          curl --max-time 12 -sSIL -o /dev/null -w 'HTTP code: %{http_code}; redirect: %{redirect_url}; IP: %{remote_ip}\n' http://radar.wodburn.com.br/ || true
          echo "HTTPS no subdominio:"
          curl --max-time 12 -sSIL -o /dev/null -w 'HTTPS code: %{http_code}; IP: %{remote_ip}; SSL verify: %{ssl_verify_result}\n' https://radar.wodburn.com.br/ || true

      - name: Conferir nameservers autoritativos da Locaweb
        run: |
          echo "NS do dominio vistos por resolver publico:"
          dig @1.1.1.1 +time=4 +tries=1 +short wodburn.com.br NS || true
          echo "SOA do dominio:"
          dig @1.1.1.1 +time=4 +tries=1 +short wodburn.com.br SOA || true
          for ns in ns1.locaweb.com.br ns2.locaweb.com.br ns3.locaweb.com.br; do
            echo "CNAME visto em $ns:"
            dig @"$ns" +time=4 +tries=1 +noall +answer radar.wodburn.com.br CNAME || true
            echo "A visto em $ns:"
            dig @"$ns" +time=4 +tries=1 +noall +answer radar.wodburn.com.br A || true
          done
